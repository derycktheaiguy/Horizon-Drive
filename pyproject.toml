[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "horizon-drive"
version = "0.2.2"
description = "Premium Google Drive desktop client for Linux"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Horizon Hub Media"}
]
keywords = ["google-drive", "linux", "sync", "desktop", "customtkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "customtkinter",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "keyring",
    "watchdog",
    "Pillow",
    "pystray",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]

[project.scripts]
horizon-drive = "horizon_drive.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/horizon_drive"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
