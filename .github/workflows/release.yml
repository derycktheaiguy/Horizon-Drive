name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build-wheel:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  build-appimage:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgirepository1.0-dev xvfb

      - name: Install app and PyInstaller
        run: pip install . pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller --noconfirm --clean horizon-drive.spec

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp -r dist/horizon-drive/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/horizon-drive
          sed "s/^Icon=.*/Icon=io.github.derycktheaiguy.HorizonDrive/" \
            packaging/flatpak/io.github.derycktheaiguy.HorizonDrive.desktop > AppDir/horizon-drive.desktop
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.ellipse([16, 16, 240, 240], fill=(52, 168, 83, 255))
          d.line([(80, 132), (116, 168), (176, 96)], fill=(255, 255, 255, 255), width=20)
          img.save('AppDir/io.github.derycktheaiguy.HorizonDrive.png')
          "
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/usr/bin/horizon-drive" "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          curl --fail --location --retry 3 --output appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          export VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Release tag must match pyproject.toml version"
            exit 1
          fi
          ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir "HorizonDrive-${VERSION}-x86_64.AppImage"

      - name: Test extracted AppImage outside the checkout
        run: |
          ./HorizonDrive-*.AppImage --appimage-extract
          APP_RUN="$PWD/squashfs-root/AppRun"
          cd /tmp
          xvfb-run -a "$APP_RUN" --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: HorizonDrive-*.AppImage
          if-no-files-found: error

  build-flatpak:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder xvfb
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build bundle
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          flatpak-builder --user --install-deps-from=flathub --force-clean --repo=flatpak-repo \
            flatpak-build packaging/flatpak/io.github.derycktheaiguy.HorizonDrive.json
          flatpak build-bundle flatpak-repo \
            Horizon-Drive-${VERSION}-x86_64.flatpak \
            io.github.derycktheaiguy.HorizonDrive

      - name: Test Flatpak desktop startup
        run: |
          flatpak --user install --assumeyes --noninteractive ./Horizon-Drive-*.flatpak
          xvfb-run -a flatpak run --socket=x11 io.github.derycktheaiguy.HorizonDrive --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write
    needs: [build-wheel, build-appimage, build-flatpak]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
