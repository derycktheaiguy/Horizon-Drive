name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgirepository1.0-dev

      - name: Install app and PyInstaller
        run: pip install . pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller --noconfirm --clean \
            --name horizon-drive \
            --collect-all customtkinter \
            --collect-all pystray \
            --hidden-import PIL._tkinter_finder \
            src/horizon_drive/main.py

      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/bin
          cp dist/horizon-drive/horizon-drive AppDir/usr/bin/
          cp packaging/flatpak/io.github.derycktheaiguy.HorizonDrive.desktop AppDir/horizon-drive.desktop
          python3 -c "
          from PIL import Image, ImageDraw
          img = Image.new('RGBA', (256, 256), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.ellipse([16, 16, 240, 240], fill=(52, 168, 83, 255))
          d.line([(80, 132), (116, 168), (176, 96)], fill=(255, 255, 255, 255), width=20)
          img.save('AppDir/horizon-drive.png')
          "
          printf '#!/bin/sh\nexec /usr/bin/env horizon-drive "$@"\n' > AppDir/AppRun
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          curl -sSLo appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          export VERSION="${GITHUB_REF_NAME#v}"
          ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir "HorizonDrive-${VERSION}-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: HorizonDrive-*.AppImage

  build-flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            flatpak-build packaging/flatpak/io.github.derycktheaiguy.HorizonDrive.json
          flatpak build-bundle flatpak-build/.flatpak-builder/cache \
            Horizon-Drive-${GITHUB_REF_NAME#v}-x86_64.flatpak \
            io.github.derycktheaiguy.HorizonDrive

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: "*.flatpak"

  release:
    needs: [build-wheel, build-appimage, build-flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
