name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/
      - name: Unit and reconciliation tests
        run: pytest -v
      - name: Real desktop integration tests
        env:
          HORIZON_GUI_TESTS: '1'
        run: xvfb-run -a pytest -v tests/test_gui_smoke.py
      - name: Build wheel and test installed desktop entry point
        run: |
          python -m build --wheel
          pip install dist/*.whl --force-reinstall --no-deps
          cd /tmp
          xvfb-run -a horizon-drive --smoke-test
