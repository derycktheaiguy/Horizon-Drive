name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff build

      - name: Lint with ruff
        run: ruff check src/

      - name: Syntax check
        run: |
          python -m py_compile src/main.py
          python -m py_compile src/auth.py
          python -m py_compile src/engine/sync_engine.py
          python -m py_compile src/gui/main_window.py
          python -m py_compile src/gui/welcome_wizard.py
          python -m py_compile src/gui/setup_wizard.py

      - name: Build check
        run: python -m build --wheel
